name: checks

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Proves the committed gallery still matches the emitter. Needs no Python.
      - run: npm run baseline -- --check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Numeric reference tests import the actual Python emitted by TypeScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check python
      - run: ruff format --check python
      - run: pip install -e "./python[dev,interactive]"
      - run: python -m pytest python/tests -q

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: pip install -e "./python[dev,interactive]"
      # The behavioural tests skip themselves without matplotlib, so the
      # typescript job above cannot run them. This is where they actually run.
      - run: npm test
      # The checks that need a real matplotlib, so a script that emits but does
      # not run cannot pass.
      - run: npm run render-check
      - run: npm run recipe-check
      - run: npm run compose-check
      # Every published gallery example must pass the actual strict checker.
      - run: npm run gallery-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-verification
          path: /tmp/gu-gallery-*/**
          if-no-files-found: ignore
          retention-days: 7

  distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build:translator
      - run: git diff --exit-code -- python/graphunslopify/_translator.mjs python/graphunslopify/ZOD-LICENSE.txt python/LICENSE
      - run: python -m pip install build
      - run: python -m build python --outdir dist
      - run: python scripts/install-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          retention-days: 7
