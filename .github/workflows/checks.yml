name: checks

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Proves the committed gallery still matches the emitter. Needs no Python.
      - run: npm run baseline -- --check

  python:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Numeric reference tests import the actual Python emitted by TypeScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff
      - run: ruff check python .github/actions/figure-ci/run.py scripts/check-getting-started.py scripts/install-smoke.py
      - run: ruff format --check python .github/actions/figure-ci/run.py scripts/check-getting-started.py scripts/install-smoke.py
      - run: pip install -e "./python[dev,interactive,notebook,agent,statistics,parquet,pdf]"
      - run: python -m pytest python/tests -q

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: pip install -e "./python[dev,interactive,statistics]"
      # The behavioural tests skip themselves without matplotlib, so the
      # typescript job above cannot run them. This is where they actually run.
      - run: npm test
      # The checks that need a real matplotlib, so a script that emits but does
      # not run cannot pass.
      - run: npm run render-check
      - run: npm run recipe-check
      - run: npm run compose-check
      # Every published gallery example must pass the actual strict checker.
      - run: npm run gallery-check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
      - run: python -m pytest python/tests/test_text_exports.py -q
        env:
          GRAPHUNSLOPIFY_REQUIRE_LATEX: "1"
          GRAPHUNSLOPIFY_LATEX_EVIDENCE: /tmp/gu-latex-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latex-verification
          path: /tmp/gu-latex-verification/**
          if-no-files-found: ignore
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run cell-contrast-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-contrast-verification
          path: /tmp/gu-cell-contrast-*/**
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run preview-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-editor-verification
          path: /tmp/gu-preview-check-*/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-verification
          path: /tmp/gu-gallery-*/**
          if-no-files-found: ignore
          retention-days: 7

  published-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./python
      - run: python scripts/paper-benchmark.py --out-dir /tmp/gu-published-papers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-paper-evidence
          path: /tmp/gu-published-papers/**
          retention-days: 7

  distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build:translator
      - run: git diff --exit-code -- src/codegen/cell-colour-source.ts python/graphunslopify/_translator.mjs python/graphunslopify/ZOD-LICENSE.txt python/graphunslopify/schemas python/graphunslopify/examples python/LICENSE
      - run: python -m pip install build
      - run: python -m build python --outdir dist
      - run: python scripts/install-smoke.py --agent --pdf --require-environment
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          retention-days: 7
