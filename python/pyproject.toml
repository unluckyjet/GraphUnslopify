[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphunslopify"
dynamic = ["version"]
description = "Local semantic figure generation and render-time scientific figure checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.9", "pandas>=2.0", "numpy>=1.24", "pypdf>=5", "typing_extensions>=4.4", "nodejs-wheel-binaries>=22.13.1,<25", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]
interactive = ["plotly>=5.24"]
parquet = ["pyarrow>=15"]
statistics = ["scipy>=1.10"]
notebook = ["jupyterlab>=4", "ipykernel>=6.29", "nbclient>=0.10"]
agent = ["mcp>=2.3,<3"]

[project.scripts]
graphunslopify = "graphunslopify.cli:main"

[project.urls]
Source = "https://github.com/unluckyjet/JSONTranslator"

[tool.setuptools.package-data]
graphunslopify = ["_translator.mjs", "ZOD-LICENSE.txt", "schemas/*.json", "examples/*.ipynb"]

[tool.setuptools.dynamic]
version = { attr = "graphunslopify.__version__" }

[tool.setuptools.packages.find]
include = ["graphunslopify*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF", "PLE", "PLW"]

[tool.ruff.lint.isort]
known-first-party = ["graphunslopify"]
